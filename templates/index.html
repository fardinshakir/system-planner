<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: #f0f0f0;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            width: 200px;
        }
        #controls button {
            margin: 5px 0;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            background-color: #5271ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #controls button:hover {
            background-color: #0056b3;
        }
        #search {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            width: calc(100% - 16px);
        }
        #suggestions {
            background-color: white;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            position: relative;
            z-index: 1001;
            width: calc(100% - 16px);
        }
        .suggestion-item {
            padding: 8px;
            cursor: pointer;
            color: black;
            font-size: 12px;
        }
        .suggestion-item:hover {
            background-color: #007bff;
            color: white;
        }
        .checkbox-marker {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="clearSystems()">Clear All</button>
        <button onclick="removeLastSystem()">Remove Last</button>
        <input type="text" id="search" placeholder="Search location..." autocomplete="off">
        <div id="suggestions"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            center: [40.7128, -74.0060],
            zoom: 13,
            zoomControl: false
        });

        const tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri, Maxar, Earthstar Geographics',
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        let systems = [];
        const systemRadiusMeters = 599.8464;

        const predefinedSystems = [
            { name: 'Unit 1', lat: 40.7580, lng: -73.9855, repeater: false },
            { name: 'Unit 2', lat: 40.6501, lng: -73.9496, repeater: false },
            { name: 'Unit 3', lat: 40.7282, lng: -73.7949, repeater: false },
            { name: 'Unit 4', lat: 40.8448, lng: -73.8648, repeater: true },
            { name: 'Unit 5', lat: 40.5795, lng: -74.1502, repeater: false },
        ];

        function addPredefinedSystems() {
            predefinedSystems.forEach(system => {
                const marker = L.marker([system.lat, system.lng]).addTo(map);
                marker.bindPopup(`<b>${system.name}</b><br>Waypoints: 0`);
                const increasedRadius = system.repeater ? systemRadiusMeters * 1.3 : systemRadiusMeters;
                const colors = ['#ff6a00', '#ffff00', '#1aff00'];
                const opacities = [0.0, 0.0, 0.0];
                colors.forEach((color, index) => {
                    const radius = increasedRadius * ((3 - index) / 3);
                    L.circle([system.lat, system.lng], {
                        color: color,
                        fillColor: color,
                        fillOpacity: opacities[index],
                        radius: radius
                    }).addTo(map);
                });
            });
        }

        function isWithinSystemRadius(system, latlng) {
            return map.distance(latlng, system.latlng) < systemRadiusMeters;
        }

        function addSystem(latlng) {
            const isTooClose = systems.some(system => map.distance(latlng, system.latlng) < systemRadiusMeters);
            const isInPredefinedSystem = predefinedSystems.some(system => map.distance(latlng, [system.lat, system.lng]) < systemRadiusMeters);

            const isInExtendedRadius = systems.some(system => {
                const effectiveRadius = system.hasReceiver ? systemRadiusMeters * 1.3 : systemRadiusMeters;
                return map.distance(latlng, system.latlng) < effectiveRadius;
            });

            if (isTooClose || isInPredefinedSystem || isInExtendedRadius) return;

            systems.forEach(system => {
                if (system.waypointMode) {
                    system.waypointMode = false;
                    system.waypointCounter = 0
                    system.waypoints.forEach(waypoint => {
                        map.removeLayer(waypoint);
                    });
                    system.waypoints = [];
                }
            });

            const system = {
                latlng,
                hasReceiver: false,
                waypointMode: false,
                circles: [],
                checkboxMarker: null,
                waypointCounter: 0,
                waypoints: []
            };

            const colors = ['#ff6a00', '#ffff00', '#1aff00'];
            const opacities = [0.0, 0.0, 0.0];

            colors.forEach((color, index) => {
                const radius = systemRadiusMeters * ((3 - index) / 3);
                const circle = L.circle(latlng, {
                    color: color,
                    fillColor: color,
                    fillOpacity: opacities[index],
                    radius: radius,
                    interactive: index === 2
                }).addTo(map);

                if (index === 2) {
                    circle.on('contextmenu', function(e) {
                        L.DomEvent.stopPropagation(e);

                        isCheckboxMenuOpen = true;
                        checkboxMenuElement = e.target;

                        systems.forEach(s => {
                            if (s.checkboxMarker) {
                                map.removeLayer(s.checkboxMarker);
                                s.checkboxMarker = null;
                            }
                        });

                        const checkboxDiv = L.DomUtil.create('div', 'checkbox-marker');
                        const currentSystemIndex = systems.indexOf(system);

                        checkboxDiv.innerHTML =
                            `<input type="checkbox" id="waypointCheckbox-${currentSystemIndex}" ${system.waypointMode ? 'checked' : ''} onchange="toggleWaypointMode(${currentSystemIndex}, this.checked); event.stopPropagation();">
                            <label for="waypointCheckbox-${currentSystemIndex}">Waypoint Mode</label>
                            <br>
                            <input type="checkbox" id="receiverCheckbox-${currentSystemIndex}" ${system.hasReceiver ? 'checked' : ''} onchange="toggleReceiver(systems[${currentSystemIndex}]); event.stopPropagation();">
                            <label for="receiverCheckbox-${currentSystemIndex}">Receiver</label>`;

                        system.checkboxMarker = L.marker(latlng, {
                            icon: L.divIcon({
                                className: 'checkbox-marker',
                                html: checkboxDiv.outerHTML,
                                iconSize: [120, 80]
                            })
                        }).addTo(map);

                        system.checkboxMarker.setLatLng(latlng);
                        system.checkboxMarker.on('click', function(e) {
                            e.originalEvent.stopPropagation();
                        });
                    });
                }

                system.circles.push(circle);
            });

            systems.push(system);
            updateSystemPopup(system);
        }

        function closeContextMenu() {
            if (isCheckboxMenuOpen) {
                isCheckboxMenuOpen = false;
                checkboxMenuElement = null;
                //console.log("closed menu");
            }
        }

        function toggleReceiver(system) {
            const wasReceiverEnabled = system.hasReceiver;
            system.hasReceiver = !system.hasReceiver;

            const factor = system.hasReceiver ? 1.3 : 1.0;
            system.circles.forEach((circle, index) => {
                const radius = systemRadiusMeters * factor * ((3 - index) / 3);
                circle.setRadius(radius);
            });

            if (!system.hasReceiver) {
                const effectiveRadius = systemRadiusMeters;
                system.waypoints = system.waypoints.filter(waypoint => {
                    const distance = map.distance(system.latlng, waypoint.getLatLng());
                    if (distance > effectiveRadius) {
                        map.removeLayer(waypoint);
                        return false;
                    }
                    return true;
                });

                system.waypointCounter = system.waypoints.length;
                updateWaypointsPopup(system);
                updateSystemPopup(system);
            }

            if (system.checkboxMarker) {
                map.removeLayer(system.checkboxMarker);
                system.checkboxMarker = null;
            }
        }


        function updateWaypointsPopup(system) {
            system.waypoints.forEach((waypoint, index) => {
                waypoint.bindPopup(`Waypoint ${index + 1}`);
            });
        }

        let currentWaypointSystem = null;
        let lastClickedLatLng = null;
        let isCheckboxMenuOpen = false;
        let checkboxMenuElement = null;

        function toggleWaypointMode(systemIndex, isChecked) {
            const system = systems[systemIndex];
            console.log(`Before toggling: Waypoint Mode ${isChecked ? "Enabled" : "Disabled"}`);
            console.log(`Number of waypoints for System ${systemIndex}: ${system.waypoints.length}`);
            if (isChecked) {
                if (lastClickedLatLng) {
                    const effectiveRadius = system.hasReceiver ? systemRadiusMeters * 1.3 : systemRadiusMeters;
                    const distance = map.distance(system.latlng, lastClickedLatLng);

                    if (distance <= effectiveRadius) {
                        const waypoint = L.marker(lastClickedLatLng).addTo(map);
                        waypoint.bindPopup(`Waypoint ${system.waypointCounter + 1}`).openPopup();
                        system.waypoints.push(waypoint);
                        updateSystemPopup(system);
                    }
                }

                if (currentWaypointSystem !== null) {
                    currentWaypointSystem.waypointMode = false;
                    map.off('click', handleMapClick);
                }

                currentWaypointSystem = system;
                system.waypointMode = true;
                map.on('click', handleMapClick);
            } else {
                lastClickedLatLng = system.latlng;

                map.off('click', handleMapClick);
                system.waypointMode = false;
                currentWaypointSystem = null;
            }

            if (system.checkboxMarker) {
                map.removeLayer(system.checkboxMarker);
                system.checkboxMarker = null;
            }
        }


        function handleMapClick(e) {
            if (!currentWaypointSystem || !currentWaypointSystem.waypointMode || isCheckboxMenuOpen) return;

            const system = currentWaypointSystem;
            const effectiveRadius = system.hasReceiver ? systemRadiusMeters * 1.3 : systemRadiusMeters;
            const distance = map.distance(system.latlng, e.latlng);

            if (distance <= effectiveRadius) {
                const waypoint = L.marker(e.latlng).addTo(map);
                waypoint.bindPopup(`Waypoint ${system.waypointCounter + 1}`).openPopup();
                system.waypoints.push(waypoint);
                system.waypointCounter++;

                updateSystemPopup(system);
            }
        }



        function updateSystemPopup(system) {
            const index = systems.indexOf(system);

            if (system.marker) {
                map.removeLayer(system.marker);
            }

            const marker = L.marker(system.latlng).addTo(map);
            marker.bindPopup(`<b>System ${index + 1}</b><br>Waypoints: ${system.waypointCounter}`);

            marker.openPopup();
            system.marker = marker;
        }

        function clearSystems() {
            systems.forEach(system => {
                system.circles.forEach(circle => map.removeLayer(circle));

                system.waypoints.forEach(waypoint => map.removeLayer(waypoint));

                if (system.checkboxMarker) map.removeLayer(system.checkboxMarker);
                if (system.marker) map.removeLayer(system.marker);

                system.waypointCounter = 0;
            });

            systems = [];
        }


        function removeLastSystem() {
            if (systems.length > 0) {
                const lastSystem = systems.pop();

                lastSystem.circles.forEach(circle => map.removeLayer(circle));

                lastSystem.waypoints.forEach(waypoint => {
                    map.removeLayer(waypoint);
                });

                lastSystem.waypoints = [];

                if (lastSystem.checkboxMarker) map.removeLayer(lastSystem.checkboxMarker);
                if (lastSystem.marker) map.removeLayer(lastSystem.marker);

                lastSystem.circles = [];
                lastSystem.checkboxMarker = null;
                lastSystem.marker = null;
                lastSystem.waypointCounter = 0;
                lastSystem.waypointMode = false;

            }
        }




        addPredefinedSystems();

        let searchTimeout;
        document.getElementById('search').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value;
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = '';
            if (!query) return;

            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`, {
                    headers: { 'User-Agent': 'SystemPlanner' }
                })
                    .then(response => response.json())
                    .then(data => {
                        if (!data || data.length === 0) return;
                        data.forEach(feature => {
                            const suggestionItem = document.createElement('div');
                            suggestionItem.classList.add('suggestion-item');
                            suggestionItem.textContent = feature.display_name;
                            suggestionItem.addEventListener('click', () => {
                                const latlng = [parseFloat(feature.lat), parseFloat(feature.lon)];

                                const tempMarker = L.marker(latlng).addTo(map);
                                map.setView(latlng, 13);
                                suggestions.innerHTML = '';

                                setTimeout(() => {
                                    map.removeLayer(tempMarker);
                                }, 500);
                            });
                            suggestions.appendChild(suggestionItem);
                        });
                    });
            }, 300);
        });

        map.on('click', function(e) {
            addSystem(e.latlng);
        });

        map.on('click', function() {
            closeContextMenu();
        });

        map.on('click', function(e) {
            if (isCheckboxMenuOpen) {
                closeContextMenu();
            }
            closeContextMenu();
        });



    </script>
</body>
</html>
