<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: #f0f0f0;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            width: 200px;
        }
        #controls button {
            margin: 5px 0;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            background-color: #5271ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #controls button:hover {
            background-color: #0056b3;
        }
        #controls button.route-btn {
            background-color: #28a745;
            font-size: 12px;
            padding: 6px;
        }
        #controls button.route-btn:hover {
            background-color: #218838;
        }
        #search {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            width: calc(100% - 16px);
        }
        #suggestions {
            background-color: white;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            position: relative;
            z-index: 1001;
            width: calc(100% - 16px);
        }
        .suggestion-item {
            padding: 8px;
            cursor: pointer;
            color: black;
            font-size: 12px;
        }
        .suggestion-item:hover {
            background-color: #007bff;
            color: white;
        }
        .checkbox-marker {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
        }
        #routeInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 1000;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="clearSystems()">Clear All</button>
        <button onclick="removeLastSystem()">Remove Last</button>
        <button onclick="generateOrderedRoute()" class="route-btn">Generate Ordered Route</button>
        <button onclick="generateRandomRoute()" class="route-btn">Generate Random Route</button>
        <button onclick="clearRoute()" class="route-btn">Clear Route</button>
        <input type="text" id="search" placeholder="Search location..." autocomplete="off">
        <div id="suggestions"></div>
    </div>
    <div id="routeInfo"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        const SPEED_KMH = 14.5;
        const SPEED_MS = SPEED_KMH / 3.6;
        const DEFAULT_CAMERA_ANGLE = 100;
        const CONE_RADIUS = 60.96;

        const map = L.map('map', {
            center: [40.7128, -74.0060],
            zoom: 13,
            zoomControl: false
        });

        const tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri, Maxar, Earthstar Geographics',
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        let systems = [];
        let allWaypoints = [];
        let routePolylines = [];
        let cameraCones = [];
        let overlapOverlays = [];
        let activeCone = null;
        let isDraggingCone = false;
        let isCheckboxMenuOpen = false;
        let currentWaypointSystem = null;
        const systemRadiusMeters = 599.8464;

        const predefinedSystems = [
            { name: 'Unit 1', lat: 40.7580, lng: -73.9855, repeater: false },
            { name: 'Unit 2', lat: 40.6501, lng: -73.9496, repeater: false },
            { name: 'Unit 3', lat: 40.7282, lng: -73.7949, repeater: false },
            { name: 'Unit 4', lat: 40.8448, lng: -73.8648, repeater: true },
            { name: 'Unit 5', lat: 40.5795, lng: -74.1502, repeater: false },
        ];

        function drawCameraCone(lat, lng, bearing, angle, isActive = false) {
            const halfAngle = angle / 2;
            const startBearing = bearing - halfAngle;
            const endBearing = bearing + halfAngle;

            const points = [];
            points.push([lat, lng]);

            for (let b = startBearing; b <= endBearing; b += 5) {
                const rad = (b * Math.PI) / 180;
                const newLat = lat + (CONE_RADIUS / 111000) * Math.cos(rad);
                const newLng = lng + (CONE_RADIUS / 111000 / Math.cos(lat * Math.PI / 180)) * Math.sin(rad);
                points.push([newLat, newLng]);
            }
            points.push([lat, lng]);

            const color = isActive ? '#ffff00' : '#00ff00';
            const polygon = L.polyline(points, {
                color: color,
                weight: isActive ? 3 : 2,
                opacity: isActive ? 0.8 : 0.4,
                fillColor: color,
                fillOpacity: isActive ? 0.2 : 0.1
            }).addTo(map);

            polygon.bearing = bearing;
            polygon.latlng = L.latLng(lat, lng);
            polygon.angle = angle;

            if (isActive) {
                const tipBearing = bearing * Math.PI / 180;
                const tipLat = lat + (CONE_RADIUS / 111000) * Math.cos(tipBearing);
                const tipLng = lng + (CONE_RADIUS / 111000 / Math.cos(lat * Math.PI / 180)) * Math.sin(tipBearing);

                const handle = L.marker([tipLat, tipLng], {
                    icon: L.divIcon({
                        html: '<div style="width: 12px; height: 12px; background: #ffff00; border: 2px solid white; border-radius: 50%; cursor: grab;"></div>',
                        iconSize: [12, 12]
                    })
                }).addTo(map);

                polygon.handle = handle;
            }

            cameraCones.push(polygon);
            return polygon;
        }

        function addPredefinedSystems() {
            predefinedSystems.forEach(system => {
                const marker = L.marker([system.lat, system.lng]).addTo(map);
                marker.bindPopup(`<b>${system.name}</b>`);
                const increasedRadius = system.repeater ? systemRadiusMeters * 1.3 : systemRadiusMeters;
                const colors = ['#ff6a00', '#ffff00', '#1aff00'];
                const opacities = [0.0, 0.0, 0.0];
                colors.forEach((color, index) => {
                    const radius = increasedRadius * ((3 - index) / 3);
                    L.circle([system.lat, system.lng], {
                        color: color,
                        fillColor: color,
                        fillOpacity: opacities[index],
                        radius: radius
                    }).addTo(map);
                });
            });
        }

        function addSystem(latlng) {
            const isTooClose = systems.some(system => map.distance(latlng, system.latlng) < systemRadiusMeters);
            const isInPredefinedSystem = predefinedSystems.some(system => map.distance(latlng, [system.lat, system.lng]) < systemRadiusMeters);

            if (isTooClose || isInPredefinedSystem) return;

            const system = {
                latlng,
                waypointMode: false,
                hasReceiver: false,
                circles: [],
                checkboxMarker: null,
                waypoints: []
            };

            const colors = ['#ff6a00', '#ffff00', '#1aff00'];
            const opacities = [0.0, 0.0, 0.0];

            colors.forEach((color, index) => {
                const radius = systemRadiusMeters * ((3 - index) / 3);
                const circle = L.circle(latlng, {
                    color: color,
                    fillColor: color,
                    fillOpacity: opacities[index],
                    radius: radius,
                    interactive: index === 2
                }).addTo(map);

                if (index === 2) {
                    circle.on('contextmenu', function(e) {
                        L.DomEvent.stopPropagation(e);
                        isCheckboxMenuOpen = true;
                        showWaypointToggle(system);
                    });
                }

                system.circles.push(circle);
            });

            systems.push(system);
            updateSystemPopup(system);
        }

        function showWaypointToggle(system) {
            systems.forEach(s => {
                if (s.checkboxMarker) {
                    map.removeLayer(s.checkboxMarker);
                    s.checkboxMarker = null;
                }
            });

            const checkboxDiv = L.DomUtil.create('div', 'checkbox-marker');
            const systemIndex = systems.indexOf(system);

            checkboxDiv.innerHTML = `
                <input type="checkbox" id="waypointCheckbox-${systemIndex}" ${system.waypointMode ? 'checked' : ''} onchange="toggleWaypointMode(${systemIndex}, this.checked); event.stopPropagation();">
                <label for="waypointCheckbox-${systemIndex}">Waypoint Mode</label>
                <br>
                <input type="checkbox" id="receiverCheckbox-${systemIndex}" ${system.hasReceiver ? 'checked' : ''} onchange="toggleReceiver(${systemIndex}); event.stopPropagation();">
                <label for="receiverCheckbox-${systemIndex}">Receiver</label>
            `;

            system.checkboxMarker = L.marker(system.latlng, {
                icon: L.divIcon({
                    className: 'checkbox-marker',
                    html: checkboxDiv.outerHTML,
                    iconSize: [120, 80]
                })
            }).addTo(map);

            system.checkboxMarker.on('click', function(e) {
                e.originalEvent.stopPropagation();
            });
        }

        function toggleReceiver(systemIndex) {
            const system = systems[systemIndex];
            system.hasReceiver = !system.hasReceiver;

            system.circles.forEach((circle, index) => {
                const factor = system.hasReceiver ? 1.3 : 1.0;
                const radius = systemRadiusMeters * factor * ((3 - index) / 3);
                circle.setRadius(radius);
            });

            if (system.checkboxMarker) {
                map.removeLayer(system.checkboxMarker);
                system.checkboxMarker = null;
            }
        }

        function toggleWaypointMode(systemIndex, isChecked) {
            const system = systems[systemIndex];
            system.waypointMode = isChecked;

            if (isChecked) {
                if (currentWaypointSystem && currentWaypointSystem !== system) {
                    currentWaypointSystem.waypointMode = false;
                }
                currentWaypointSystem = system;
            } else {
                currentWaypointSystem = null;
                if (activeCone && activeCone.handle) {
                    map.removeLayer(activeCone.handle);
                }
                if (activeCone) {
                    map.removeLayer(activeCone);
                }
                activeCone = null;
            }

            if (system.checkboxMarker) {
                map.removeLayer(system.checkboxMarker);
                system.checkboxMarker = null;
            }
        }

        function createWaypoint(latlng) {
            if (!currentWaypointSystem) return;

            if (activeCone && activeCone.handle) {
                map.removeLayer(activeCone.handle);
            }
            if (activeCone) {
                map.removeLayer(activeCone);
            }

            activeCone = drawCameraCone(latlng.lat, latlng.lng, 0, DEFAULT_CAMERA_ANGLE, true);
            activeCone.systemIndex = systems.indexOf(currentWaypointSystem);
            activeCone.latlng = latlng;

            map.dragging.disable();
        }

        function getConePolygon(latlng, bearing, angle) {
            const halfAngle = angle / 2;
            const startBearing = bearing - halfAngle;
            const endBearing = bearing + halfAngle;

            const points = [];
            points.push([latlng.lng, latlng.lat]);

            for (let b = startBearing; b <= endBearing; b += 2) {
                const rad = (b * Math.PI) / 180;
                const newLat = latlng.lat + (CONE_RADIUS / 111000) * Math.cos(rad);
                const newLng = latlng.lng + (CONE_RADIUS / 111000 / Math.cos(latlng.lat * Math.PI / 180)) * Math.sin(rad);
                points.push([newLng, newLat]);
            }
            points.push([latlng.lng, latlng.lat]);

            return turf.polygon([points]);
        }

        function pointInCone(point, coneCenter, bearing, angle) {
            const distance = map.distance(point, coneCenter);
            if (distance > CONE_RADIUS) return false;

            const halfAngle = angle / 2;
            const dx = point.lng - coneCenter.lng;
            const dy = point.lat - coneCenter.lat;

            let pointBearing = Math.atan2(dx, dy) * 180 / Math.PI;
            pointBearing = (pointBearing + 360) % 360;

            const bearingDiff = Math.abs(bearing - pointBearing);
            const normalizedDiff = bearingDiff > 180 ? 360 - bearingDiff : bearingDiff;

            return normalizedDiff <= halfAngle;
        }

        function checkAndHighlightOverlaps() {
            overlapOverlays.forEach(overlay => map.removeLayer(overlay));
            overlapOverlays = [];

            for (let i = 0; i < allWaypoints.length; i++) {
                for (let j = i + 1; j < allWaypoints.length; j++) {
                    const wp1 = allWaypoints[i];
                    const wp2 = allWaypoints[j];

                    const distance = map.distance(wp1.latlng, wp2.latlng);
                    if (distance > CONE_RADIUS * 2) continue;

                    try {
                        const cone1 = getConePolygon(wp1.latlng, wp1.bearing, DEFAULT_CAMERA_ANGLE);
                        const cone2 = getConePolygon(wp2.latlng, wp2.bearing, DEFAULT_CAMERA_ANGLE);

                        if (turf.booleanIntersects(cone1, cone2)) {
                            const intersection = turf.intersect(cone1, cone2);

                            if (intersection && intersection.geometry && intersection.geometry.coordinates) {
                                let coords = intersection.geometry.coordinates;

                                if (intersection.geometry.type === 'Polygon') {
                                    coords = coords[0];
                                } else if (intersection.geometry.type === 'MultiPolygon') {
                                    coords = coords[0][0];
                                }

                                if (coords && coords.length > 2) {
                                    const latLngs = coords.map(c => [c[1], c[0]]);

                                    const overlay = L.polygon(latLngs, {
                                        color: '#ff0000',
                                        fillColor: '#ff0000',
                                        fillOpacity: 0.35,
                                        weight: 1,
                                        interactive: false
                                    }).addTo(map);

                                    overlapOverlays.push(overlay);
                                }
                            }
                        }
                    } catch (e) {
                        console.log('Overlap error:', e);
                    }
                }
            }
        }

        function confirmWaypoint() {
            if (!activeCone || !currentWaypointSystem) return;

            const waypoint = {
                latlng: activeCone.latlng,
                bearing: activeCone.bearing,
                cameraAngle: DEFAULT_CAMERA_ANGLE
            };

            allWaypoints.push(waypoint);
            currentWaypointSystem.waypoints.push(waypoint);

            const marker = L.marker(activeCone.latlng).addTo(map);
            marker.bindPopup(`<b>Waypoint ${allWaypoints.length}</b><br>Bearing: ${Math.round(activeCone.bearing)}°`);

            if (activeCone.handle) {
                map.removeLayer(activeCone.handle);
            }
            activeCone.setStyle({ color: '#00ff00', weight: 2, opacity: 0.4 });
            activeCone = null;

            checkAndHighlightOverlaps();
            map.dragging.enable();
        }

        function updateSystemPopup(system) {
            const index = systems.indexOf(system);

            if (system.marker) {
                map.removeLayer(system.marker);
            }

            const marker = L.marker(system.latlng).addTo(map);
            marker.bindPopup(`<b>System ${index + 1}</b><br>Waypoints: ${system.waypoints.length}`);
            marker.openPopup();
            system.marker = marker;
        }

        function calculateDistance(latlng1, latlng2) {
            return map.distance(latlng1, latlng2);
        }

        function drawRoute(orderedWaypoints) {
            clearRoute();

            if (orderedWaypoints.length < 2) {
                alert('Add at least 2 waypoints');
                return;
            }

            let totalDistance = 0;
            let totalTime = 0;

            for (let i = 0; i < orderedWaypoints.length - 1; i++) {
                const distance = calculateDistance(orderedWaypoints[i].latlng, orderedWaypoints[i + 1].latlng);
                totalDistance += distance;

                const line = L.polyline([orderedWaypoints[i].latlng, orderedWaypoints[i + 1].latlng], {
                    color: '#ff0000',
                    weight: 3,
                    opacity: 0.7
                }).addTo(map);

                routePolylines.push(line);

                const time = distance / SPEED_MS;
                totalTime += time;

                const midpoint = [
                    (orderedWaypoints[i].latlng.lat + orderedWaypoints[i + 1].latlng.lat) / 2,
                    (orderedWaypoints[i].latlng.lng + orderedWaypoints[i + 1].latlng.lng) / 2
                ];

                const label = L.marker(midpoint, {
                    icon: L.divIcon({
                        className: 'route-label',
                        html: `<div style="background: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; color: black; font-weight: bold;">${(distance / 1000).toFixed(2)}km<br>${(time / 60).toFixed(1)}min</div>`,
                        iconSize: [60, 40]
                    })
                }).addTo(map);

                routePolylines.push(label);
            }

            const hours = Math.floor(totalTime / 3600);
            const minutes = Math.floor((totalTime % 3600) / 60);
            const seconds = Math.floor(totalTime % 60);

            const infoDiv = document.getElementById('routeInfo');
            infoDiv.innerHTML = `
                <div><b>Route Generated</b></div>
                <div>Total Distance: ${(totalDistance / 1000).toFixed(2)} km</div>
                <div>Total Time: ${hours}h ${minutes}m ${seconds}s</div>
            `;
            infoDiv.style.display = 'block';
        }

        function generateOrderedRoute() {
            drawRoute(allWaypoints);
        }

        function generateRandomRoute() {
            const shuffled = [...allWaypoints].sort(() => Math.random() - 0.5);
            drawRoute(shuffled);
        }

        function clearRoute() {
            routePolylines.forEach(line => map.removeLayer(line));
            routePolylines = [];
            document.getElementById('routeInfo').style.display = 'none';
        }

        function clearSystems() {
            systems.forEach(system => {
                system.circles.forEach(circle => map.removeLayer(circle));
                if (system.checkboxMarker) map.removeLayer(system.checkboxMarker);
                if (system.marker) map.removeLayer(system.marker);
            });
            systems = [];
            clearWaypoints();
        }

        function removeLastSystem() {
            if (systems.length > 0) {
                const lastSystem = systems.pop();
                lastSystem.circles.forEach(circle => map.removeLayer(circle));
                if (lastSystem.checkboxMarker) map.removeLayer(lastSystem.checkboxMarker);
                if (lastSystem.marker) map.removeLayer(lastSystem.marker);
            }
        }

        function clearWaypoints() {
            allWaypoints = [];
            cameraCones.forEach(c => map.removeLayer(c));
            cameraCones = [];
            overlapOverlays.forEach(overlay => map.removeLayer(overlay));
            overlapOverlays = [];
            systems.forEach(system => {
                system.waypoints = [];
            });
            if (activeCone && activeCone.handle) {
                map.removeLayer(activeCone.handle);
            }
            if (activeCone) {
                map.removeLayer(activeCone);
            }
            activeCone = null;
            currentWaypointSystem = null;
            clearRoute();
        }

        addPredefinedSystems();

        let searchTimeout;
        document.getElementById('search').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value;
            const suggestions = document.getElementById('suggestions');
            suggestions.innerHTML = '';
            if (!query) return;

            searchTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`, {
                    headers: { 'User-Agent': 'SystemPlanner' }
                })
                    .then(response => response.json())
                    .then(data => {
                        if (!data || data.length === 0) return;
                        data.forEach(feature => {
                            const suggestionItem = document.createElement('div');
                            suggestionItem.classList.add('suggestion-item');
                            suggestionItem.textContent = feature.display_name;
                            suggestionItem.addEventListener('click', () => {
                                const latlng = [parseFloat(feature.lat), parseFloat(feature.lon)];

                                const tempMarker = L.marker(latlng).addTo(map);
                                map.setView(latlng, 13);
                                suggestions.innerHTML = '';

                                setTimeout(() => {
                                    map.removeLayer(tempMarker);
                                }, 500);
                            });
                            suggestions.appendChild(suggestionItem);
                        });
                    });
            }, 300);
        });

        map.on('click', function(e) {
            if (isCheckboxMenuOpen) {
                isCheckboxMenuOpen = false;
                return;
            }

            if (currentWaypointSystem && currentWaypointSystem.waypointMode) {
                const distance = map.distance(e.latlng, currentWaypointSystem.latlng);
                if (distance <= systemRadiusMeters) {
                    if (activeCone) {
                        confirmWaypoint();
                    } else {
                        createWaypoint(e.latlng);
                    }
                }
            } else {
                addSystem(e.latlng);
            }
        });

        function updateConeGeometry(cone, lat, lng, bearing, angle) {
            const halfAngle = angle / 2;
            const startBearing = bearing - halfAngle;
            const endBearing = bearing + halfAngle;

            const points = [];
            points.push([lat, lng]);

            for (let b = startBearing; b <= endBearing; b += 5) {
                const rad = (b * Math.PI) / 180;
                const newLat = lat + (CONE_RADIUS / 111000) * Math.cos(rad);
                const newLng = lng + (CONE_RADIUS / 111000 / Math.cos(lat * Math.PI / 180)) * Math.sin(rad);
                points.push([newLat, newLng]);
            }
            points.push([lat, lng]);

            cone.setLatLngs(points);
        }

        function updateConeHandle(cone, lat, lng, bearing) {
            if (!cone.handle) return;

            const tipBearing = bearing * Math.PI / 180;
            const tipLat = lat + (CONE_RADIUS / 111000) * Math.cos(tipBearing);
            const tipLng = lng + (CONE_RADIUS / 111000 / Math.cos(lat * Math.PI / 180)) * Math.sin(tipBearing);

            cone.handle.setLatLng([tipLat, tipLng]);
        }

        map.on('mousemove', function(e) {
            if (!activeCone || !isDraggingCone) return;

            const origin = activeCone.latlng;
            const mousePos = e.latlng;

            const dx = mousePos.lng - origin.lng;
            const dy = mousePos.lat - origin.lat;

            let bearing = Math.atan2(dx, dy) * 180 / Math.PI;
            bearing = (bearing + 360) % 360;

            activeCone.bearing = bearing;
            updateConeGeometry(activeCone, origin.lat, origin.lng, bearing, DEFAULT_CAMERA_ANGLE);
            updateConeHandle(activeCone, origin.lat, origin.lng, bearing);
        });

        map.on('mousedown', function(e) {
            if (activeCone) {
                isDraggingCone = true;
            }
        });

        map.on('mouseup', function() {
            isDraggingCone = false;
        });

    </script>
</body>
</html>
